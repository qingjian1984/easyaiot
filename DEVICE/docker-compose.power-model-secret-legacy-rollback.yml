# TD-005 1.0.51 旧镜像专用回退覆盖层；仅在 Config Tree 最终键部署失败时使用。
services:
  iot-device:
    environment:
      EASYAIOT_POWER_MODEL_IDEMPOTENCY_HMAC_SECRET: !reset null
    secrets:
      - source: easyaiot_power_model_hmac_legacy
        target: easyaiot.power-model.idempotency-hmac-secret-file-content

secrets:
  easyaiot_power_model_hmac_legacy:
    file: ${EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE:?set an absolute repository-external secret file}
