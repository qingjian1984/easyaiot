# TD-005 canary 专用 secret 注入覆盖层；必须与 DEVICE/docker-compose.yml 一起使用。
# EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE 必须指向仓库外、无换行、至少 32 UTF-8 字节的文件。
services:
  iot-device:
    environment:
      # 删除基础 Compose 中的同名空环境变量，避免其覆盖 Spring Config Tree。
      EASYAIOT_POWER_MODEL_IDEMPOTENCY_HMAC_SECRET: !reset null
    secrets:
      - source: easyaiot_power_model_hmac
        target: easyaiot.power-model.idempotency-hmac-secret

secrets:
  easyaiot_power_model_hmac:
    file: ${EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE:?set an absolute repository-external secret file}
