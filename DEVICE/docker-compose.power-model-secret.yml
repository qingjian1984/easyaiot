# TD-005 canary 专用 secret 注入覆盖层；必须与 DEVICE/docker-compose.yml 一起使用。
# 直接文件 provider 模式：EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE（宿主机）必须指向仓库外、
# 无换行、至少 32 UTF-8 字节的文件；容器内通过 Compose secrets 挂载到
# /run/secrets/easyaiot_power_model_hmac，由 PowerModelIdempotencySecretProvider 启动期 fail-closed 读取。
services:
  iot-device:
    environment:
      # 兼容回退：保持明文环境为空；直接文件 provider 不读此项。
      EASYAIOT_POWER_MODEL_IDEMPOTENCY_HMAC_SECRET: !reset null
      # 直接文件 provider 读取的容器内挂载路径（非敏感）。
      EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE: /run/secrets/easyaiot_power_model_hmac
    secrets:
      - source: easyaiot_power_model_hmac
        target: easyaiot_power_model_hmac

secrets:
  easyaiot_power_model_hmac:
    file: ${EASYAIOT_POWER_MODEL_HMAC_SECRET_FILE:?set an absolute repository-external secret file}
