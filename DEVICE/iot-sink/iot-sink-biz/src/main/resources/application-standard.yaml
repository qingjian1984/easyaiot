--- #################### standard 形态：无 TDengine 中间件，数据源延迟初始化 ####################

spring:
  datasource:
    dynamic:
      datasource:
        tdengine:
          lazy: true

--- #################### EasyAIoT Telemetry 启用（center 侧 Inbox + MQTT subscriber） ####################

# TD-003 center 侧 telemetry inbox + MQTT subscriber 启用开关。
# 连接参数（host/port/credentials）见 application.yaml 的 easyaiot.telemetry.mqtt 段。
# query（PRD §4.5 查询/导出）默认 false：mini 档 fail-closed；standard/full
# 部署评审通过后经 EASYAIOT_TELEMETRY_QUERY_ENABLED=true 启用。
easyaiot:
  telemetry:
    inbox:
      enabled: true
    mqtt:
      enabled: true
    query:
      enabled: ${EASYAIOT_TELEMETRY_QUERY_ENABLED:false}
