# TD-001 collector 形态：工业采集结果必须先进入 SQLite Outbox。
spring:
  main:
    web-application-type: none
  cloud:
    # Do not create a Spring Cloud bootstrap context: collector configuration is
    # exclusively the mounted local snapshot and must never fall back to Nacos.
    bootstrap:
      enabled: false
    nacos:
      # Collector reads only the mounted local snapshot; it never falls back to Nacos.
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

easyaiot:
  outbox:
    enabled: true
    volume-path: ${EASYAIOT_COLLECTOR_OUTBOX_PATH:/var/lib/easyaiot/outbox}
    queue-capacity: ${EASYAIOT_COLLECTOR_OUTBOX_QUEUE_CAPACITY:4096}
  collector:
    # Agent injects this fixed identity into the single-workload container.
    workload-id: ${EASYAIOT_COLLECTOR_WORKLOAD_ID:}
    config-directory: ${EASYAIOT_COLLECTOR_CONFIG_DIR:/var/lib/easyaiot/config}
    reconcile-interval-ms: ${EASYAIOT_COLLECTOR_RECONCILE_INTERVAL_MS:1000}
    mqtt:
      # 启用 collector MQTT publisher + ACK subscriber（装配由 SqliteOutboxAutoConfiguration 的
      # @ConditionalOnProperty(easyaiot.collector.mqtt.enabled=true) 控制）。
      # VertxCollectorMqttPublisher 已支持 username/password 条件注入（生产 EMQX 禁匿名时通过环境变量注入）。
      enabled: true
      host: ${EASYAIOT_COLLECTOR_MQTT_HOST:localhost}
      port: ${EASYAIOT_COLLECTOR_MQTT_PORT:1883}
      client-id: ${EASYAIOT_COLLECTOR_MQTT_CLIENT_ID:collector-telemetry}
      username: ${EASYAIOT_COLLECTOR_MQTT_USERNAME:}
      password: ${EASYAIOT_COLLECTOR_MQTT_PASSWORD:}
      qos: 1
      # LC03-02：ACK 订阅集合由 CollectorAckSubscriptionCoordinator 按
      # “applied 路由 ∪ 未终态 outbox 路由”精确派生，不再配置 ack-topic-prefix。

basiclab:
  iot:
    sink:
      protocol:
        http:
          enabled: false
        modbus:
          enabled: false
        modbus-rtu:
          # Center DB polling is not assembled in collector Profile. The
          # collector runtime owns the local snapshot and the shared RTU I/O engine.
          enabled: false
          scan-interval-ms: ${EASYAIOT_COLLECTOR_SCAN_INTERVAL_MS:1000}
          request-timeout-ms: ${EASYAIOT_COLLECTOR_REQUEST_TIMEOUT_MS:5000}
          worker-threads: ${EASYAIOT_COLLECTOR_WORKER_THREADS:2}
        opcua:
          enabled: false
        mqtt:
          enabled: false
