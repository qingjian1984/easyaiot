# 构建期依赖缓存（运行时无需挂载）：
#   项目根 .build-cache/web/pnpm-store — docker build 时 local cache（见 Dockerfile、install_linux.sh）
#   默认属主 UID/GID=1000
services:
  web-service:
    image: web-service:latest
    container_name: web-service
    user: root

    # 端口映射
    ports:
      - "${WEB_PORT:-8888}:80"
      # SITE 官网（nginx.conf / nginx.mini.conf 内 listen 8090）
      - "${SITE_PORT:-8090}:8090"

    # 数据卷挂载
    volumes:
      # Nginx配置文件（mini 形态由 install_linux.sh 写入 NGINX_CONF=./conf/nginx.mini.conf）
      - ${NGINX_CONF:-./conf/nginx.conf}:/etc/nginx/nginx.conf:ro
      # SITE 官网静态产物（可选）：先 pnpm --dir SITE build，再挂载
      # - ${SITE_HTML:-../SITE/dist}:/usr/share/nginx/html/SITE:ro
      # WEB前端构建/运行日志目录（非nginx access/error日志）
      - ./logs:/app/logs
      # SSL证书（如果存在）
      - ./conf/ssl:/etc/nginx/ssl:ro
      # 时区文件挂载
      - /etc/localtime:/etc/localtime:ro

    # 环境变量
    environment:
      # 时区配置
      - TZ=Asia/Shanghai

    # 添加hosts映射，使容器能够通过宿主机端口访问各业务服务
    # mini 形态：admin-api 直连 system-host:48099（无 iot-gateway）
    # standard/full：经 gateway:48080 转发
    # 说明：host 网络容器（ai-service/video-service/SRS 等）运行在 docker-desktop VM 的
    # host 命名空间。Docker Desktop 的 host-gateway（192.168.65.254，WSL2 NAT 模式）只代理
    # 有端口映射的 bridge 容器，不转发 host 命名空间监听端口；而 easyaiot-network 网桥的
    # 网关 172.18.0.1 就是 docker-desktop VM 自身，经它可达全部 host 服务（2026-08-19 实测
    # 48080/48099/5000/6000/1985/6080/1984 全部连通）。
    extra_hosts:
      - "gateway:172.18.0.1"
      - "system-host:172.18.0.1"
      - "video-host:172.18.0.1"  # 用于访问使用host网络模式的video-service（端口6000）
      - "ai-host:172.18.0.1"  # 用于访问使用host网络模式的ai-service（端口5000）
      - "srs-host:172.18.0.1"  # 用于访问使用host网络模式的SRS服务（端口1985）
      - "zlm-host:172.18.0.1"  # 用于访问ZLMediaKit(WVP/GB28181)的ws-flv/http-flv播流端口（宿主机6080）
      - "rtc-host:172.18.0.1"  # 用于访问 RTC/go2rtc 服务（1984 WebUI、6100 管理 API）
      # 若 easyaiot-network 重建导致网段变化，先 docker network inspect easyaiot-network
      # 查询 Gateway 再更新；Linux 云服务器部署可改回 host-gateway 或宿主机实际 IP。

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # 网络配置（连接到统一网络，以便访问AI和VIDEO服务）
    networks:
      - easyaiot-network

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  easyaiot-network:
    name: easyaiot-network
    external: true

